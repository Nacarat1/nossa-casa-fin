<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1120" id="metaThemeColor" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Nossa Casa" />
  <meta name="description" content="Controle financeiro doméstico do casal: salários, contas fixas, variáveis, 4 cartões e saldo previsto." />

  <title>Nossa Casa — Finanças</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body>
  <div class="app-shell">
    <!-- Cabeçalho fixo com seletor de mês e filtro de visão -->
    <header class="topbar">
      <div class="topbar-row">
        <div class="brand">
          <span class="brand-dot"></span>
          <span class="brand-name">Nossa Casa</span>
        </div>

        <div class="month-nav" aria-label="Navegação de mês">
          <button type="button" class="icon-btn" id="btnPrevMonth" aria-label="Mês anterior">‹</button>
          <button type="button" class="month-pill" id="btnCurrentMonth" title="Voltar para o mês atual">Nov 2026</button>
          <button type="button" class="icon-btn" id="btnNextMonth" aria-label="Próximo mês">›</button>
        </div>
      </div>

      <div class="scope-switcher" id="scopeSwitcher" role="tablist" aria-label="Visão financeira">
        <button type="button" class="scope-btn active" data-scope="house">🏠 Casa</button>
        <button type="button" class="scope-btn" data-scope="p1" id="scopeBtnP1">Eu</button>
        <button type="button" class="scope-btn" data-scope="p2" id="scopeBtnP2">Namorada</button>
      </div>
    </header>

    <!-- Conteúdo principal rolável -->
    <main class="main-content" id="mainContent" aria-live="polite"></main>

    <!-- Botão flutuante de lançamento rápido -->
    <button type="button" class="fab" id="btnQuickAdd" aria-label="Novo lançamento">
      <span class="fab-plus">+</span>
    </button>

    <!-- Barra de navegação inferior estilo app nativo -->
    <nav class="bottom-nav" aria-label="Navegação principal">
      <button type="button" class="nav-item active" data-tab="home">
        <span class="nav-icon">📊</span>
        <span class="nav-label">Início</span>
      </button>
      <button type="button" class="nav-item" data-tab="expenses">
        <span class="nav-icon">🧾</span>
        <span class="nav-label">Gastos</span>
      </button>
      <button type="button" class="nav-item" data-tab="cards">
        <span class="nav-icon">💳</span>
        <span class="nav-label">Cartões</span>
      </button>
      <button type="button" class="nav-item" data-tab="fixed">
        <span class="nav-icon">📌</span>
        <span class="nav-label">Fixos</span>
      </button>
      <button type="button" class="nav-item" data-tab="settings">
        <span class="nav-icon">⚙️</span>
        <span class="nav-label">Ajustes</span>
      </button>
    </nav>
  </div>

  <!-- Bottom Sheet / Modal reutilizável -->
  <div class="modal-backdrop hidden" id="modalBackdrop">
    <div class="modal-sheet" id="modalSheet" role="dialog" aria-modal="true">
      <div class="sheet-handle"></div>
      <div class="sheet-header">
        <h2 class="sheet-title" id="modalTitle">Novo Lançamento</h2>
        <button type="button" class="icon-btn" id="btnCloseModal" aria-label="Fechar">✕</button>
      </div>
      <div class="sheet-body" id="modalBody"></div>
    </div>
  </div>

  <!-- Toast de feedback -->
  <div class="toast hidden" id="toast" role="status"></div>

  <!-- Input oculto para importar JSON -->
  <input type="file" id="fileImportInput" accept="application/json,.json" class="hidden" />

  <script src="./js/finance.js"></script>
  <script src="./js/storage.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
